name: Bootstrap CI
on:
  push:
    branches: ["feat/v1-implementation"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck with diagnostic capture
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            gh issue comment 1 --body-file typecheck.log
            exit "$code"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Unit tests with diagnostic capture
        shell: bash
        run: |
          set +e
          npm run test:unit > tests.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            gh issue comment 1 --body-file tests.log
            exit "$code"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
